name: GNG Browser QA
on:
  push:
    branches: [main]
    paths:
      - 'tests/browser.spec.cjs'
      - 'tests/accessibility.spec.cjs'
      - '**/*.css'
      - '**/*.html'
      - 'site-data.js'
      - '.github/workflows/gng-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright test runner
        run: npm install --no-save --ignore-scripts @playwright/test@1.56.1 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Create capture folder
        run: mkdir -p artifacts
      - name: Run safe read-only browser checks
        run: npx playwright test tests/browser.spec.cjs tests/accessibility.spec.cjs --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gng-qa-browser-captures
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
