name: GNG Browser QA
on:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '.github/workflows/gng-browser-qa.yml'
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure published HTML has caught up with GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          expected=$(grep -o 'theme.css?v=[0-9.]*' index.html | head -n1)
          echo "Awaiting published asset reference: $expected"
          for attempt in $(seq 1 45); do
            if curl --retry 2 --silent --show-error --fail --max-time 12 \
              -H 'Cache-Control: no-cache' \
              "https://vyzo-studio.github.io/Veltro_portifolio/?qa=${GITHUB_SHA}-${attempt}" \
              -o /tmp/gng-live-index.html && grep -Fq "$expected" /tmp/gng-live-index.html; then
              echo "Published page uses the intended CSS version."
              exit 0
            fi
            sleep 4
          done
          echo "GitHub Pages has not published the expected HTML; refuse a stale browser test." >&2
          exit 1
      - name: Verify GitHub Pages serves current audited files
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            match=true
            for file in index.html site-data.js legal-contact.js; do
              live="/tmp/gng-published-${file//\//_}"
              if ! curl --retry 2 --silent --show-error --fail --max-time 12 \
                -H 'Cache-Control: no-cache' \
                "https://vyzo-studio.github.io/Veltro_portifolio/${file}?qa=${GITHUB_SHA}-${attempt}" \
                -o "$live" || ! cmp -s "$file" "$live"; then
                match=false
                break
              fi
            done
            if [ "$match" = true ]; then
              echo "Current index.html, site-data.js and legal-contact.js verified on GitHub Pages."
              exit 0
            fi
            sleep 4
          done
          echo "GitHub Pages still serves different application bytes; abort stale browser QA." >&2
          exit 1
      - name: Install pinned Playwright test runner
        run: npm install --no-save --ignore-scripts @playwright/test@1.56.1 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Create capture folder
        run: mkdir -p artifacts
      - name: Run safe read-only browser checks
        run: npx playwright test tests/browser.spec.cjs tests/accessibility.spec.cjs tests/performance.spec.cjs tests/global-experience.spec.cjs --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gng-qa-browser-captures
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
