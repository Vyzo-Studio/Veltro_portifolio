name: GNG Image Optimization
on:
  push:
    branches: [main]
    paths:
      - 'scripts/optimize-images.py'
      - '.github/workflows/gng-optimize-images.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gng-image-optimization
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image encoder
        run: python -m pip install Pillow==11.3.0
      - name: Generate and measure WebP variants
        run: python scripts/optimize-images.py
      - name: Commit optimized images and responsive references
        run: |
          if [ -z "$(git status --porcelain -- assets/ index.html)" ]; then
            echo "No image changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.webp index.html
          git commit -m "perf(images): publish optimized responsive portfolio images"
          git push
