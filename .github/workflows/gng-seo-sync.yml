name: VELTRO Demo SEO Validation
on:
  push:
    branches: [work/veltro-v5-singularity, main]
    paths:
      - 'scripts/sync-seo.cjs'
      - 'index.html'
      - '.github/workflows/gng-seo-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify static creative-work metadata (no external database)
        run: |
          node --check scripts/sync-seo.cjs
          node scripts/sync-seo.cjs
          cp index.html /tmp/veltro-index-seo.html
          node scripts/sync-seo.cjs
          cmp /tmp/veltro-index-seo.html index.html
          grep -q '"@type":"CreativeWork"' index.html
          ! grep -qE 'https://[^" ]+\.supabase\.co' index.html
