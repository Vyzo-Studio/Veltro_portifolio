name: GNG SEO Sync

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync-seo.cjs'
      - '.github/workflows/gng-seo-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gng-seo-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update static metadata from public Supabase RPC
        run: node scripts/sync-seo.cjs
      - name: Commit only if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "Already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore(seo): sync metadata from business settings"
          git push
