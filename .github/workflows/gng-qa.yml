name: GNG QA Regression

on:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.cjs'
      - '**/*.html'
      - '**/*.css'
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'scripts/validate-static.py'
      - '.github/workflows/gng-qa.yml'
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.cjs'
      - '**/*.html'
      - '**/*.css'
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'scripts/validate-static.py'
      - '.github/workflows/gng-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: JavaScript, booking, financial and static QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned static validators
        run: python -m pip install tinycss2==1.4.0 pglast==8.7
      - name: Parse application JavaScript
        run: |
          for file in script.js site-data.js privacy.js i18n.js legal-i18n.js customer-memory.js config.js theme.js admin.js admin-barbers.js admin-business.js admin-manual-payment.js admin-calendar.js admin-notifications.js scripts/sync-seo.cjs; do
            node --check "$file"
          done
      - name: Booking and consent regressions
        run: node tests/booking-reliability.test.cjs
      - name: Administrative mutation regressions
        run: node tests/admin-mutations.test.cjs
      - name: Manual in-person payment regressions
        run: node tests/manual-payment.test.cjs
      - name: Administrative email and authorization regressions
        run: node tests/admin-login.test.cjs
      - name: Image upload security regressions
        run: node tests/upload-validation.test.cjs
      - name: Dynamic business SEO regressions
        run: node tests/seo-sync.test.cjs
      - name: HTML CSS SQL syntax and references
        run: python scripts/validate-static.py
